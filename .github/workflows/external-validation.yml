name: AURORA external physical validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "external_validation/**"
      - "aurora_source/**"
      - "requirements.txt"
      - ".github/workflows/external-validation.yml"

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg

jobs:
  pythonicdisort-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip freeze | tee installed-packages.txt

      - name: Run recognized external-solver benchmark
        id: benchmark
        continue-on-error: true
        run: |
          mkdir -p validation_artifacts
          python external_validation/run_pythonicdisort_benchmark.py \
            --output validation_artifacts \
            --cases 72 \
            --seed 20260805 2>&1 | tee validation_artifacts/execution.log

      - name: Create provenance and checksums
        if: always()
        run: |
          python external_validation/finalize_artifacts.py validation_artifacts

      - name: Upload complete evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aurora-pythonicdisort-validation
          path: validation_artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce scientific gate
        if: always()
        run: |
          python external_validation/enforce_gate.py validation_artifacts/benchmark_summary.json
